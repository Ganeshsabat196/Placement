<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DS Interview Prep</title>
  <meta name="description" content="Data Scientist interview preparation: concept notes, 200 interview questions with answers, and case studies with worked solutions.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <script>
    (function () {
      try { var t = localStorage.getItem('dsprep-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link id="hl-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <link id="hl-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="read-progress" aria-hidden="true"><span id="readBar"></span></div>

  <header class="header">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/"><span class="brand-mark">📊</span><span>DS Interview Prep</span></a>
    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search concepts, questions, cases…" autocomplete="off" aria-label="Search">
      <kbd class="search-kbd">/</kbd>
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div class="overlay" id="overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <nav id="nav"></nav>
      <div id="toc"></div>
    </aside>
    <main id="main">
      <p class="loading" id="loading">Loading…</p>
    </main>
  </div>

  <div class="floating">
    <div class="timer" id="timer" hidden>
      <span class="timer-label">Case timer</span>
      <span class="timer-time" id="timerTime">25:00</span>
      <button class="btn small" id="timerStart">Start</button>
      <button class="btn small ghost" id="timerReset" aria-label="Reset timer">Reset</button>
    </div>
    <button class="icon-btn fab" id="toTop" aria-label="Back to top" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="assets/content.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
